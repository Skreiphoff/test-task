services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 3s
      retries: 60

  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${APP_PORT:-8088}:8080"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
    command: php artisan queue:work --sleep=1 --max-time=3600
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    user: postgres
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-testing-db.sql:/docker-entrypoint-initdb.d/init-testing-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.6
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
