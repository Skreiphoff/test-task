server {
    listen 8080;
    root /var/www/html/public;
    index index.php;
    # A webhook with 500 items is far below 1 MB; larger bodies would only keep the FPM workers busy.
    client_max_body_size 1m;
    server_tokens off;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        # Re-resolve on every request: the app container gets a new IP when it is recreated.
        resolver 127.0.0.11 valid=5s;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
